%YAML 1.2
---
$id: http://devicetree.org/schemas/misc/ashen,hbv1.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Ashen tamper monitor

maintainers:
  - Jan Sebastian Götte <kernel@yasec.de>

description:
  A microcontroller attached over a UART that watches tamper sensors. The
  host keeps an encrypted heartbeat link to it and panics when the monitor
  reports tamper or stops answering.

allOf:
  - $ref: /schemas/serial/serial-peripheral-props.yaml#

properties:
  compatible:
    const: ashen,hbv1

  timeout-us:
    description:
      Time after the last heartbeat reply at which the host gives up on the
      monitor and panics, while the heartbeat is armed.
    default: 10000

  refresh-ivl-us:
    description: Interval between heartbeat requests.
    default: 5000

  no-autostart:
    type: boolean
    description:
      Do not arm the heartbeat once the link is up; leave arming to
      userspace.

required:
  - compatible

unevaluatedProperties: false

examples:
  - |
    serial {
        tamper {
            compatible = "ashen,hbv1";
            current-speed = <4000000>;
            timeout-us = <100000>;
            refresh-ivl-us = <50000>;
            no-autostart;
        };
    };
